<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Explainer · Snowflake Basics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--snow:#29B5E8;--green:#1D9E75;--orange:#FF694A;--text:#1a1a1a;--text-muted:#6b7280;--bg:#ffffff;--bg-surface:#f9f9f8;--border:rgba(0,0,0,0.09);--border-strong:rgba(0,0,0,0.16);--radius:10px;--radius-lg:14px;}
  @media(prefers-color-scheme:dark){:root{--text:#f0f0f0;--text-muted:#8a8f9a;--bg:#0d1117;--bg-surface:#161b22;--border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.14);}}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  nav{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:52px;border-bottom:0.5px solid var(--border);}
  .nav-logo{font-family:'DM Mono',monospace;font-size:13px;color:var(--snow);}
  .nav-back{font-size:13px;color:var(--text-muted);text-decoration:none;}
  .nav-back:hover{color:var(--text);}
  .page{max-width:860px;margin:0 auto;padding:36px 32px 80px;}
  .page-tag{font-size:11px;font-family:'DM Mono',monospace;color:var(--snow);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
  .page-title{font-family:'DM Serif Display',serif;font-size:26px;margin-bottom:6px;}
  .page-sub{font-size:14px;color:var(--text-muted);margin-bottom:32px;}
  .stepper{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;}
  .step-btn{padding:7px 14px;border-radius:20px;border:0.5px solid var(--border-strong);background:var(--bg);color:var(--text-muted);font-size:12px;font-family:'DM Mono',monospace;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px;}
  .step-btn:hover{border-color:var(--snow);color:var(--text);}
  .step-btn.active{background:var(--snow);border-color:var(--snow);color:white;}
  .step-num{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:10px;}
  .step-btn:not(.active) .step-num{background:var(--bg-surface);color:var(--text-muted);}
  .canvas-wrap{border:0.5px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-surface);overflow:hidden;margin-bottom:20px;}
  canvas{display:block;width:100%;}
  .explanation{border:0.5px solid var(--border);border-radius:var(--radius-lg);background:var(--bg);padding:20px 24px;margin-bottom:20px;}
  .exp-label{font-size:11px;font-family:'DM Mono',monospace;color:var(--snow);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
  .exp-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:8px;}
  .exp-body{font-size:14px;color:var(--text-muted);line-height:1.7;}
  .exp-body strong{color:var(--text);font-weight:500;}
  .nav-btns{display:flex;gap:10px;}
  .nav-btn{padding:10px 20px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--bg);color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background 0.12s;}
  .nav-btn:hover{background:var(--bg-surface);}
  .nav-btn.primary{background:var(--snow);border-color:var(--snow);color:white;}
  .nav-btn.primary:hover{opacity:0.88;}
  .nav-btn:disabled{opacity:0.3;cursor:default;}
</style>
</head>
<body>
<nav>
  <span class="nav-logo">❄️ snowflake basics · visual explainer</span>
  <a href="/courses/snowflake-basics/index.html" class="nav-back">← Back to session</a>
</nav>
<div class="page">
  <div class="page-tag">Interactive animation</div>
  <div class="page-title">How Snowflake works</div>
  <div class="page-sub">Click through each scene or use arrow keys.</div>
  <div class="stepper" id="stepper"></div>
  <div class="canvas-wrap"><canvas id="sf-canvas" height="280"></canvas></div>
  <div class="explanation" id="explanation"></div>
  <div class="nav-btns">
    <button class="nav-btn" id="prev-btn" onclick="prevScene()">← Previous</button>
    <button class="nav-btn primary" id="next-btn" onclick="nextScene()">Next →</button>
  </div>
</div>
<script>
const W=796,H=280;
const SNOW='#29B5E8',GREEN='#1D9E75',ORANGE='#FF694A',NAVY='#0d1117';

const scenes=[
  {label:'The problem',title:'Traditional databases: storage and compute are coupled',body:'In a traditional database, storage and compute live on the same server. When queries get slow, your only option is to upgrade the whole server. Expensive. Slow to provision. And you pay for it 24/7 whether you are using it or not.',draw:drawScene0},
  {label:'Snowflake architecture',title:'Snowflake separates compute from storage',body:'Snowflake splits them into two independent layers. <strong>Storage</strong> holds all your data in compressed columnar files in the cloud. <strong>Compute</strong> - the virtual warehouse - runs your queries. They scale independently. You only pay for compute while it is actually running.',draw:drawScene1},
  {label:'Virtual warehouses',title:'Multiple warehouses, same data',body:'Different teams can have their own <strong>virtual warehouse</strong> querying the same underlying storage simultaneously. The data science team runs their heavy models while the finance team runs their reports - no contention, no waiting, no impact on each other.',draw:drawScene2},
  {label:'Database structure',title:'Database - Schema - Table',body:'Data in Snowflake is organised in three layers. A <strong>database</strong> is the top-level container. It contains <strong>schemas</strong> which organise related tables together. Schemas contain <strong>tables and views</strong>. You reference data as database.schema.table.',draw:drawScene3},
  {label:'The data stack',title:'Snowflake is at the centre of the modern data stack',body:'Ingestion tools like Fivetran load raw data <strong>into</strong> Snowflake. dbt transforms it <strong>inside</strong> Snowflake by running SQL models. BI tools like Looker query Snowflake to build dashboards. Git version-controls the code. Snowflake is the centre of gravity.',draw:drawScene4},
  {label:'Scale up and down',title:'Pay per second - scale when you need it',body:'For a big monthly report, scale the warehouse <strong>up</strong> to XL - it runs in minutes instead of hours. When done, scale back <strong>down</strong> to XS. You pay for XL compute only for the duration of that job. This is the core financial benefit of Snowflake.',draw:drawScene5},
];

let cur=0;
const canvas=document.getElementById('sf-canvas');
const ctx=canvas.getContext('2d');

function setup(){const dpr=window.devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.scale(dpr,dpr);}
function isDark(){return window.matchMedia('(prefers-color-scheme: dark)').matches;}
function C(){const d=isDark();return{bg:d?'#161b22':'#f9f9f8',text:d?'#f0f0f0':'#1a1a1a',muted:d?'#8a8f9a':'#6b7280',border:d?'#2a2f3a':'#e5e7eb',cell:d?'#0d1117':'#ffffff'};}
function clear(){const c=C();ctx.fillStyle=c.bg;ctx.fillRect(0,0,W,H);}
function box(x,y,w,h,fill,stroke,r=6){ctx.save();ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=0.5;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.stroke();ctx.restore();}
function txt(text,x,y,size,color,align='center',font='DM Sans'){ctx.save();ctx.fillStyle=color;ctx.font=size+'px '+font+', sans-serif';ctx.textAlign=align;ctx.fillText(text,x,y);ctx.restore();}
function mono(text,x,y,size,color,align='center'){txt(text,x,y,size,color,align,'DM Mono');}
function arrow(x1,y1,x2,y2,color){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);const a=Math.atan2(y2-y1,x2-x1);ctx.moveTo(x2,y2);ctx.lineTo(x2-10*Math.cos(a-0.4),y2-10*Math.sin(a-0.4));ctx.moveTo(x2,y2);ctx.lineTo(x2-10*Math.cos(a+0.4),y2-10*Math.sin(a+0.4));ctx.stroke();ctx.restore();}
function badge(text,x,y,color){ctx.save();ctx.font='500 11px DM Mono,monospace';const tw=ctx.measureText(text).width;const pw=tw+16,ph=22;ctx.fillStyle=color+'22';ctx.beginPath();ctx.roundRect(x-pw/2,y-ph/2,pw,ph,6);ctx.fill();ctx.strokeStyle=color+'60';ctx.lineWidth=0.5;ctx.stroke();ctx.fillStyle=color;ctx.textAlign='center';ctx.fillText(text,x,y+4);ctx.restore();}

function drawScene0(){
  clear();const c=C();
  box(248,40,300,180,c.cell,c.border);
  txt('Traditional Database Server',398,68,13,c.muted);
  box(278,85,240,55,ORANGE+'22',ORANGE+'60');
  txt('Compute',398,108,13,c.text);txt('(CPU / Memory)',398,125,11,c.muted,'center','DM Mono');
  box(278,155,240,50,'#185FA522','#185FA560');
  txt('Storage',398,175,13,c.text);txt('(Disk)',398,192,11,c.muted,'center','DM Mono');
  ctx.save();ctx.strokeStyle=ORANGE;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(398,140);ctx.lineTo(398,155);ctx.stroke();ctx.restore();
  txt('Coupled together on one server',398,232,12,c.muted);
  txt('To run faster - upgrade the whole server. Expensive. Takes days.',398,252,12,'#E24B4A');
}

function drawScene1(){
  clear();const c=C();
  box(30,80,220,100,SNOW+'18',SNOW+'60');
  txt('Storage Layer',140,110,13,c.text);
  txt('Compressed columnar files',140,128,11,c.muted,'center','DM Mono');
  txt('in the cloud',140,144,11,c.muted,'center','DM Mono');
  box(546,80,220,100,GREEN+'18',GREEN+'60');
  txt('Compute Layer',656,110,13,c.text);
  txt('Virtual Warehouse',656,128,11,c.muted,'center','DM Mono');
  txt('runs your queries',656,144,11,c.muted,'center','DM Mono');
  arrow(250,130,546,130,c.border);
  badge('scale independently',398,110,SNOW);
  badge('pay per second',398,145,GREEN);
  txt('Storage holds your data. Compute runs your queries. They are completely separate.',W/2,232,13,c.muted);
  txt('Scale compute up for a big query. Scale back down when done.',W/2,252,13,c.muted);
}

function drawScene2(){
  clear();const c=C();
  box(50,100,200,80,SNOW+'18',SNOW+'60');
  txt('Shared Storage',150,130,13,c.text);
  txt('same data for everyone',150,148,11,c.muted,'center','DM Mono');
  const warehouses=[{x:340,label:'Finance WH',color:GREEN},{x:490,label:'Data Science WH',color:ORANGE},{x:640,label:'Ops WH',color:SNOW}];
  warehouses.forEach(w=>{
    box(w.x,70,120,55,w.color+'22',w.color+'60');
    txt(w.label,w.x+60,100,11,c.text);
    txt('XS warehouse',w.x+60,116,10,c.muted,'center','DM Mono');
    arrow(250,140,w.x,140,c.border);
    ctx.save();ctx.strokeStyle=c.border;ctx.lineWidth=0.5;ctx.setLineDash([2,2]);ctx.beginPath();ctx.moveTo(w.x+60,125);ctx.lineTo(w.x+60,140);ctx.stroke();ctx.restore();
  });
  txt('Three teams. Three warehouses. One storage layer. No contention.',W/2,210,13,c.muted);
  txt('Each warehouse can be a different size. Each scales independently.',W/2,230,13,c.muted);
}

function drawScene3(){
  clear();const c=C();
  box(40,40,220,200,SNOW+'12',SNOW+'40');
  txt('ANALYTICS_DB',150,68,13,SNOW);
  box(60,82,180,70,GREEN+'12',GREEN+'40');
  txt('SALES_SCHEMA',150,105,12,c.text);
  box(80,118,140,26,c.cell,c.border,4);mono('orders',150,135,11,c.muted);
  box(80,148,140,26,c.cell,c.border,4);mono('customers',150,165,11,c.muted);
  box(60,162,180,60,ORANGE+'12',ORANGE+'40');
  txt('FINANCE_SCHEMA',150,182,12,c.text);
  box(80,196,140,18,c.cell,c.border,4);mono('budgets',150,209,11,c.muted);
  txt('ANALYTICS_DB.SALES_SCHEMA.orders',470,120,12,SNOW,'center','DM Mono');
  ctx.save();ctx.strokeStyle=c.border;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(260,125);ctx.lineTo(350,120);ctx.stroke();ctx.restore();
  box(330,100,330,80,c.cell,c.border);
  mono('SELECT * FROM',490,128,11,'#7fbbff');
  mono('ANALYTICS_DB.SALES_SCHEMA.orders',490,147,11,SNOW);
  mono('LIMIT 10;',490,166,11,'#7fbbff');
  txt('Three-part dot notation. Same pattern across all SQL databases.',W/2,230,13,c.muted);
  txt('Database > Schema > Table',W/2,250,13,c.muted);
}

function drawScene4(){
  clear();const c=C();
  const items=[
    {x:30,icon:'📥',name:'Ingestion',tool:'Fivetran',color:'#6B5CE7'},
    {x:185,icon:'❄️',name:'Snowflake',tool:'warehouse',color:SNOW,highlight:true},
    {x:340,icon:'🔁',name:'Transform',tool:'dbt',color:ORANGE},
    {x:495,icon:'📊',name:'Visualise',tool:'Looker',color:GREEN},
    {x:650,icon:'🔀',name:'Version',tool:'Git',color:'#185FA5'},
  ];
  items.forEach((item,i)=>{
    const bg=item.highlight?SNOW+'25':c.cell;
    const border=item.highlight?SNOW+'80':c.border;
    box(item.x,60,130,100,bg,border);
    txt(item.icon,item.x+65,98,22,c.text);
    txt(item.name,item.x+65,122,13,item.highlight?SNOW:c.text);
    mono(item.tool,item.x+65,138,10,c.muted);
    if(i<items.length-1){
      const dir=i===0||i===3?'→':'→';
      arrow(item.x+130,110,item.x+155,110,c.border);
    }
  });
  txt('Snowflake is the centre. Every tool in the stack connects to it.',W/2,210,13,c.muted);
  txt('It stores the data. Everything else transforms, queries, or controls it.',W/2,230,13,c.muted);
}

function drawScene5(){
  clear();const c=C();
  const sizes=[{label:'XS',h:30,cost:'$0.50/hr',color:SNOW+'60'},{label:'S',h:50,cost:'$1/hr',color:SNOW+'80'},{label:'M',h:80,cost:'$2/hr',color:SNOW+'aa'},{label:'L',h:120,cost:'$4/hr',color:SNOW+'cc'},{label:'XL',h:160,cost:'$8/hr',color:SNOW}];
  sizes.forEach((s,i)=>{
    const x=80+i*130;
    const y=220-s.h;
    box(x,y,90,s.h,s.color,SNOW+'40',4);
    txt(s.label,x+45,y+s.h/2+5,14,c.text);
    mono(s.cost,x+45,240,10,c.muted);
  });
  badge('Monthly report: scale to XL, run, scale back to XS',398,258,ORANGE);
  txt('Bigger warehouse = faster queries = higher cost per hour.',W/2,34,13,c.muted);
  txt('Right-size for each job. Pay only for what you use.',W/2,54,13,c.muted);
}

function renderScene(i){
  scenes[i].draw();
  document.getElementById('explanation').innerHTML='<div class="exp-label">Scene '+(i+1)+' of '+scenes.length+' - '+scenes[i].label+'</div><div class="exp-title">'+scenes[i].title+'</div><div class="exp-body">'+scenes[i].body+'</div>';
  document.querySelectorAll('.step-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.getElementById('prev-btn').disabled=i===0;
  document.getElementById('next-btn').disabled=i===scenes.length-1;
  document.getElementById('next-btn').textContent=i===scenes.length-1?'Done':'Next →';
}
function nextScene(){if(cur<scenes.length-1){cur++;renderScene(cur);}}
function prevScene(){if(cur>0){cur--;renderScene(cur);}}

const el=document.getElementById('stepper');
scenes.forEach((s,i)=>{
  const btn=document.createElement('button');
  btn.className='step-btn'+(i===0?' active':'');
  btn.innerHTML='<span class="step-num">'+(i+1)+'</span>'+s.label;
  btn.onclick=()=>{cur=i;renderScene(i);};
  el.appendChild(btn);
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')nextScene();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')prevScene();
});
window.addEventListener('resize',()=>{setup();renderScene(cur);});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>renderScene(cur));
setup();renderScene(0);
</script>
</body>
</html>
