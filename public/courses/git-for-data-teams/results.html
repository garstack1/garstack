<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Results · Git for Data Teams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF694A; --navy: #0d1117; --green: #1D9E75;
    --text: #1a1a1a; --text-muted: #6b7280;
    --bg: #ffffff; --bg-surface: #f9f9f8;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.18);
    --radius: 10px; --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text: #f0f0f0; --text-muted: #8a8f9a; --bg: #0d1117; --bg-surface: #161b22; --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.15); }
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 52px; border-bottom: 0.5px solid var(--border); }
  .nav-logo { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--orange); }
  .nav-right { display: flex; align-items: center; gap: 14px; }
  .nav-back { font-size: 13px; color: var(--text-muted); text-decoration: none; }
  .live-dot { display: flex; align-items: center; gap: 6px; font-size: 12px; font-family: 'DM Mono', monospace; color: var(--green); }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .page { max-width: 960px; margin: 0 auto; padding: 36px 32px 60px; }
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
  .page-header h1 { font-family: 'DM Serif Display', serif; font-size: 26px; }
  .page-header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
  .btn-reset { background: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 7px 16px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--text-muted); transition: background 0.12s; }
  .btn-reset:hover { background: var(--bg-surface); color: var(--text); }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card { background: var(--bg-surface); border-radius: var(--radius); padding: 16px; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-val { font-family: 'DM Serif Display', serif; font-size: 28px; }
  .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* QUESTION CARDS */
  .q-grid { display: flex; flex-direction: column; gap: 20px; }
  .q-card { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg); }
  .q-card-header { padding: 18px 22px 14px; border-bottom: 0.5px solid var(--border); background: var(--bg-surface); }
  .q-num-tag { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--orange); letter-spacing: 1px; margin-bottom: 6px; }
  .q-text { font-size: 15px; font-weight: 500; line-height: 1.4; }
  .q-card-body { padding: 18px 22px; }

  /* BARS */
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .bar-label { font-size: 13px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bar-letter { width: 22px; height: 22px; border-radius: 50%; border: 0.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: 'DM Mono', monospace; flex-shrink: 0; color: var(--text-muted); }
  .bar-letter.correct-ans { background: var(--green); border-color: var(--green); color: white; }
  .bar-text { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .bar-wrap { flex: 1; height: 28px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; min-width: 80px; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; background: var(--orange); }
  .bar-fill.correct-fill { background: var(--green); }
  .bar-count { font-size: 13px; font-family: 'DM Mono', monospace; color: var(--text-muted); min-width: 28px; text-align: right; flex-shrink: 0; }
  .bar-pct { font-size: 12px; color: var(--text-light); min-width: 38px; text-align: right; flex-shrink: 0; }

  .q-footer { padding: 10px 22px 14px; display: flex; align-items: center; gap: 14px; }
  .q-total { font-size: 12px; color: var(--text-muted); }
  .accuracy-badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-family: 'DM Mono', monospace; }
  .accuracy-badge.good { background: rgba(29,158,117,0.12); color: #0F6E56; }
  .accuracy-badge.mid { background: rgba(186,117,23,0.12); color: #854F0B; }
  .accuracy-badge.low { background: rgba(226,75,74,0.12); color: #A32D2D; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .big { font-size: 42px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; margin-bottom: 6px; }
  .empty-state small { font-size: 13px; font-family: 'DM Mono', monospace; color: var(--text-light); }

  .last-update { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-light); }
</style>
</head>
<body>
<nav>
  <span class="nav-logo">📊 results dashboard</span>
  <div class="nav-right">
    <span class="live-dot"><span class="pulse"></span> live</span>
    <a href="index.html" class="nav-back">← Back to session</a>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <div>
      <h1>Quiz results</h1>
      <p>Updating every 3 seconds &nbsp;·&nbsp; <span class="last-update" id="last-update">Waiting for responses…</span></p>
    </div>
    <button class="btn-reset" onclick="resetData()">Reset results</button>
  </div>

  <div class="stats-row" id="stats-row">
    <div class="stat-card"><div class="stat-label">Responses</div><div class="stat-val" id="s-responses">0</div><div class="stat-sub">learners</div></div>
    <div class="stat-card"><div class="stat-label">Avg score</div><div class="stat-val" id="s-avg">—</div><div class="stat-sub">out of 4</div></div>
    <div class="stat-card"><div class="stat-label">Overall accuracy</div><div class="stat-val" id="s-acc">—</div><div class="stat-sub">correct answers</div></div>
    <div class="stat-card"><div class="stat-label">Perfect scores</div><div class="stat-val" id="s-perfect">0</div><div class="stat-sub">4/4 correct</div></div>
  </div>

  <div id="charts" class="q-grid"></div>
</div>

<script>
const STORAGE_KEY = 'git_quiz_results';

const questions = [
  {
    q: "What is the main purpose of a Git branch?",
    opts: ["To permanently delete old versions","To work on changes safely without affecting main","To automatically deploy to production","To share files over email"],
    correct: 1
  },
  {
    q: "Which command creates a new branch AND switches to it?",
    opts: ["git branch new-branch","git merge new-branch","git checkout -b new-branch","git push new-branch"],
    correct: 2
  },
  {
    q: "What is a pull request (PR) used for?",
    opts: ["Downloading files from the internet","Asking teammates to review your branch before merging","Deleting a branch after it's merged","Reverting a broken commit"],
    correct: 1
  },
  {
    q: "In dbt Cloud, when you edit a model on a branch, what happens in Git?",
    opts: ["dbt emails changes to the team","dbt saves a backup locally","dbt commits changes to the branch","dbt pushes directly to main"],
    correct: 2
  }
];

function getData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { responses: [] };
  } catch(e) { return { responses: [] }; }
}

function resetData() {
  if (confirm('Reset all quiz results? This cannot be undone.')) {
    localStorage.removeItem(STORAGE_KEY);
    render();
  }
}

function render() {
  const data = getData();
  const responses = data.responses || [];
  const n = responses.length;

  document.getElementById('s-responses').textContent = n;

  if (n === 0) {
    document.getElementById('s-avg').textContent = '—';
    document.getElementById('s-acc').textContent = '—';
    document.getElementById('s-perfect').textContent = '0';
    document.getElementById('charts').innerHTML = `<div class="empty-state"><div class="big">📋</div><p>No responses yet</p><small>Ask learners to open quiz.html on their device</small></div>`;
    return;
  }

  const avgScore = responses.reduce((s, r) => s + (r.score || 0), 0) / n;
  const perfect = responses.filter(r => r.score === 4).length;
  const totalAnswers = responses.flatMap(r => r.answers || []);
  const totalCorrect = totalAnswers.filter(a => a.isCorrect).length;
  const overallAcc = totalAnswers.length ? Math.round((totalCorrect / totalAnswers.length) * 100) : 0;

  document.getElementById('s-avg').textContent = avgScore.toFixed(1);
  document.getElementById('s-acc').textContent = overallAcc + '%';
  document.getElementById('s-perfect').textContent = perfect;

  const chartsEl = document.getElementById('charts');
  chartsEl.innerHTML = '';

  questions.forEach((q, qi) => {
    const counts = new Array(q.opts.length).fill(0);
    responses.forEach(r => {
      const ans = (r.answers || []).find(a => a.question === q.q);
      if (ans && ans.chosen !== undefined && ans.chosen >= 0 && ans.chosen < counts.length) {
        counts[ans.chosen]++;
      }
    });
    const total = counts.reduce((a,b) => a+b, 0);
    const correctCount = counts[q.correct];
    const accuracy = total ? Math.round((correctCount / total) * 100) : 0;
    const maxCount = Math.max(...counts, 1);

    const card = document.createElement('div');
    card.className = 'q-card';

    let barsHtml = '';
    const letters = ['A','B','C','D'];
    q.opts.forEach((opt, oi) => {
      const cnt = counts[oi];
      const pct = Math.round((cnt / Math.max(maxCount,1)) * 100);
      const isCorrect = oi === q.correct;
      barsHtml += `
        <div class="bar-row">
          <div class="bar-label" style="width:200px;min-width:200px">
            <div class="bar-letter ${isCorrect ? 'correct-ans' : ''}">${letters[oi]}</div>
            <span class="bar-text" title="${opt}">${opt}</span>
          </div>
          <div class="bar-wrap">
            <div class="bar-fill ${isCorrect ? 'correct-fill' : ''}" style="width:${pct}%"></div>
          </div>
          <div class="bar-count">${cnt}</div>
          <div class="bar-pct">${total ? Math.round((cnt/total)*100) : 0}%</div>
        </div>`;
    });

    const accClass = accuracy >= 70 ? 'good' : accuracy >= 40 ? 'mid' : 'low';

    card.innerHTML = `
      <div class="q-card-header">
        <div class="q-num-tag">Q${qi+1} of ${questions.length}</div>
        <div class="q-text">${q.q}</div>
      </div>
      <div class="q-card-body">${barsHtml}</div>
      <div class="q-footer">
        <span class="q-total">${total} response${total !== 1 ? 's' : ''}</span>
        <span class="accuracy-badge ${accClass}">${accuracy}% correct</span>
      </div>`;

    chartsEl.appendChild(card);
  });

  document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

render();
setInterval(render, 3000);
</script>
</body>
</html>
